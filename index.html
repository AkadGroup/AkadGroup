<!DOCTYPE html>
<!-- version: 3.0.0 -->
<!-- lang stays "ar" for correct Arabic pronunciation and font selection, while
     dir is "ltr" so the page structure reads left-to-right. Individual Arabic
     strings still shape right-to-left via the Unicode bidi algorithm. -->
<html lang="ar" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="AKAD GROUP — Luxury Beauty Collection. مستحضرات التجميل والعناية بالبشرة."
    />
    <title>AKAD GROUP — Luxury Beauty Collection</title>
    <link rel="stylesheet" href="styles.css" />
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('theme');
          if (saved === 'dark' || (!saved && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.setAttribute('data-theme', 'dark');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <!--
      SVG sprite: icons are inlined once and referenced with <use> so the page
      stays dependency-free (no icon CDN) without repeating path data per card.
    -->
    <svg class="sprite" aria-hidden="true" focusable="false">
      <symbol id="icon-grid" viewBox="0 0 24 24">
        <path
          d="M4 4h6v6H4zM14 4h6v6h-6zM4 14h6v6H4zM14 14h6v6h-6z"
          fill="none"
          stroke="currentColor"
          stroke-width="1.6"
          stroke-linejoin="round"
        />
      </symbol>
      <symbol id="icon-tag" viewBox="0 0 24 24">
        <path
          d="M3.5 12.5V4.5a1 1 0 0 1 1-1h8l7.5 7.5a1.5 1.5 0 0 1 0 2.1l-6.9 6.9a1.5 1.5 0 0 1-2.1 0z"
          fill="none"
          stroke="currentColor"
          stroke-width="1.6"
          stroke-linejoin="round"
        />
        <circle cx="8" cy="8" r="1.4" fill="currentColor" />
      </symbol>
      <symbol id="icon-store" viewBox="0 0 24 24">
        <path
          d="M4 9.5V19a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1V9.5M3 9.5 5 4h14l2 5.5a3 3 0 0 1-6 0 3 3 0 0 1-6 0 3 3 0 0 1-6 0Z"
          fill="none"
          stroke="currentColor"
          stroke-width="1.6"
          stroke-linejoin="round"
        />
      </symbol>
      <symbol id="icon-bottle" viewBox="0 0 24 24">
        <path
          d="M10 2.75h4v3.1l2.1 2.4a4 4 0 0 1 1 2.65v8.35a2 2 0 0 1-2 2H8.9a2 2 0 0 1-2-2V10.9a4 4 0 0 1 1-2.65L10 5.85z"
          fill="none"
          stroke="currentColor"
          stroke-width="1.5"
          stroke-linejoin="round"
        />
        <path d="M7.4 13.5h9.2" stroke="currentColor" stroke-width="1.5" />
      </symbol>
      <symbol id="icon-search" viewBox="0 0 24 24">
        <circle
          cx="11"
          cy="11"
          r="6.5"
          fill="none"
          stroke="currentColor"
          stroke-width="1.7"
        />
        <path
          d="m16 16 4.5 4.5"
          stroke="currentColor"
          stroke-width="1.7"
          stroke-linecap="round"
        />
      </symbol>
      <symbol id="icon-cart" viewBox="0 0 24 24">
        <path
          d="M3 4h2.2l2.4 10.4a1.5 1.5 0 0 0 1.5 1.1h7.8a1.5 1.5 0 0 0 1.45-1.1L20.5 7H6"
          fill="none"
          stroke="currentColor"
          stroke-width="1.7"
          stroke-linecap="round"
          stroke-linejoin="round"
        />
        <circle cx="10" cy="19.5" r="1.4" fill="currentColor" />
        <circle cx="16.5" cy="19.5" r="1.4" fill="currentColor" />
      </symbol>
      <symbol id="icon-close" viewBox="0 0 24 24">
        <path
          d="m6 6 12 12M18 6 6 18"
          stroke="currentColor"
          stroke-width="1.8"
          stroke-linecap="round"
        />
      </symbol>
      <symbol id="icon-plus" viewBox="0 0 24 24">
        <path
          d="M12 5v14M5 12h14"
          stroke="currentColor"
          stroke-width="1.8"
          stroke-linecap="round"
        />
      </symbol>
      <symbol id="icon-minus" viewBox="0 0 24 24">
        <path d="M5 12h14" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" />
      </symbol>
      <symbol id="icon-user" viewBox="0 0 24 24">
        <circle cx="12" cy="8" r="3.6" fill="none" stroke="currentColor" stroke-width="1.7" />
        <path
          d="M4.5 20a7.5 7.5 0 0 1 15 0"
          fill="none"
          stroke="currentColor"
          stroke-width="1.7"
          stroke-linecap="round"
        />
      </symbol>
      <symbol id="icon-dashboard" viewBox="0 0 24 24">
        <path
          d="M12 3.2 20 6.4v5.1c0 4.4-3.1 8.2-8 9.3-4.9-1.1-8-4.9-8-9.3V6.4z"
          fill="none"
          stroke="currentColor"
          stroke-width="1.6"
          stroke-linejoin="round"
        />
        <path
          d="m8.8 12 2.2 2.2 4.2-4.4"
          fill="none"
          stroke="currentColor"
          stroke-width="1.7"
          stroke-linecap="round"
          stroke-linejoin="round"
        />
      </symbol>
      <symbol id="icon-dashboard" viewBox="0 0 24 24">
        <rect x="3" y="3" width="7" height="9" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
        <rect x="14" y="3" width="7" height="5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
        <rect x="14" y="12" width="7" height="9" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
        <rect x="3" y="16" width="7" height="5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
      </symbol>
      <symbol id="icon-box" viewBox="0 0 24 24">
        <path
          d="M12 3 4 7v10l8 4 8-4V7zM4 7l8 4 8-4M12 11v10"
          fill="none"
          stroke="currentColor"
          stroke-width="1.6"
          stroke-linejoin="round"
        />
      </symbol>
      <symbol id="icon-orders" viewBox="0 0 24 24">
        <path
          d="M6 3.5h12a1 1 0 0 1 1 1v16l-3-2-2 2-2-2-2 2-2-2-3 2v-16a1 1 0 0 1 1-1Z"
          fill="none"
          stroke="currentColor"
          stroke-width="1.6"
          stroke-linejoin="round"
        />
        <path d="M9 8.5h6M9 12.5h6" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" />
      </symbol>
      <symbol id="icon-edit" viewBox="0 0 24 24">
        <path
          d="M4 20h4L19 9a2.1 2.1 0 0 0-3-3L5 17z"
          fill="none"
          stroke="currentColor"
          stroke-width="1.6"
          stroke-linejoin="round"
        />
      </symbol>
      <symbol id="icon-trash" viewBox="0 0 24 24">
        <path
          d="M5 7h14M9.5 7V5h5v2M6.5 7l.8 12a1 1 0 0 0 1 .9h7.4a1 1 0 0 0 1-.9l.8-12"
          fill="none"
          stroke="currentColor"
          stroke-width="1.6"
          stroke-linecap="round"
          stroke-linejoin="round"
        />
      </symbol>
      <symbol id="icon-check" viewBox="0 0 24 24">
        <circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="1.6" />
        <path
          d="m8 12.3 2.6 2.6L16 9.5"
          fill="none"
          stroke="currentColor"
          stroke-width="1.8"
          stroke-linecap="round"
          stroke-linejoin="round"
        />
      </symbol>
      <symbol id="icon-wallet" viewBox="0 0 24 24">
        <path
          d="M20 7H4a2 2 0 0 0-2 2v10a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2zM4 7V5a2 2 0 0 1 2-2h12M16 14v.01"
          fill="none"
          stroke="currentColor"
          stroke-width="1.6"
          stroke-linecap="round"
          stroke-linejoin="round"
        />
      </symbol>
      <symbol id="icon-trending" viewBox="0 0 24 24">
        <path
          d="M21 7l-7 7-4-4-7 7m15-9v5m0-5h-5"
          fill="none"
          stroke="currentColor"
          stroke-width="1.6"
          stroke-linecap="round"
          stroke-linejoin="round"
        />
      </symbol>
      <symbol id="icon-bag" viewBox="0 0 24 24">
        <path
          d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4zM3 6h18M16 10a4 4 0 0 1-8 0"
          fill="none"
          stroke="currentColor"
          stroke-width="1.6"
          stroke-linecap="round"
          stroke-linejoin="round"
        />
      </symbol>
      <symbol id="icon-bell" viewBox="0 0 24 24">
        <path
          d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9m-4.27 13a2 2 0 0 1-3.46 0"
          fill="none"
          stroke="currentColor"
          stroke-width="1.6"
          stroke-linecap="round"
          stroke-linejoin="round"
        />
      </symbol>
      <symbol id="icon-sun" viewBox="0 0 24 24">
        <circle cx="12" cy="12" r="5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
      </symbol>
      <symbol id="icon-moon" viewBox="0 0 24 24">
        <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
      </symbol>
      <symbol id="icon-print" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="6 9 6 2 18 2 18 9"></polyline>
        <path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"></path>
        <rect x="6" y="14" width="12" height="8"></rect>
      </symbol>
      <symbol id="icon-menu" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="3" y1="12" x2="21" y2="12"></line>
        <line x1="3" y1="6" x2="21" y2="6"></line>
        <line x1="3" y1="18" x2="21" y2="18"></line>
      </symbol>
    </svg>

    <a class="skip-link" href="#product-grid">تخطي إلى المنتجات</a>

    <header class="site-header">
      <div class="site-header__inner">
        <div class="brand">
          <img src="assets/logo.jpg" alt="AKAD GROUP Logo" class="brand__logo-img" />


          <div class="brand__text">
            <h1 class="brand__title">AKAD GROUP</h1>
            <p class="brand__subtitle">Luxury Beauty Collection</p>
          </div>
        </div>

        <div class="search">
          <svg class="search__icon" aria-hidden="true"><use href="#icon-search" /></svg>
          <label class="visually-hidden" for="search-input">ابحث عن منتج</label>
          <input
            id="search-input"
            class="search__input"
            type="search"
            placeholder="ابحث عن منتج أو ماركة..."
            autocomplete="off"
          />
        </div>

        <div class="header-actions">
          <button id="theme-toggle" class="header-button" type="button" aria-label="تبديل المظهر">
            <svg class="header-button__icon" aria-hidden="true">
              <use href="#icon-moon" id="theme-icon-use" />
            </svg>
          </button>
          
          <!-- Rendered hidden unless the session role is admin. -->
          <div style="position: relative; display: flex; align-items: center;">
            <button id="notifications-button" class="header-button" type="button" hidden style="position: relative;">
              <svg class="header-button__icon" aria-hidden="true">
                <use href="#icon-bell" />
              </svg>
              <span id="notifications-count" class="cart-button__badge" hidden style="top: -2px; right: -2px; transform: none; min-width: 16px; height: 16px; font-size: 10px;">0</span>
            </button>
            <div id="notifications-dropdown" class="notifications-dropdown" hidden>
              <div class="notifications-dropdown__header">الإشعارات</div>
              <div id="notifications-list" class="notifications-dropdown__list"></div>
            </div>
          </div>

          <button id="admin-button" class="header-button header-button--admin" type="button" hidden>
            <svg class="header-button__icon" aria-hidden="true">
              <use href="#icon-dashboard" />
            </svg>
            <span class="header-button__label">لوحة التحكم</span>
          </button>

          <button id="account-button" class="header-button" type="button">
            <svg class="header-button__icon" aria-hidden="true">
              <use href="#icon-user" />
            </svg>
            <span id="account-label" class="header-button__label">تسجيل الدخول</span>
          </button>

          <button id="cart-button" class="cart-button" type="button">
            <svg class="cart-button__icon" aria-hidden="true">
              <use href="#icon-cart" />
            </svg>
            <!-- Hidden at zero so an empty cart shows no badge at all. -->
            <span id="cart-count" class="cart-button__badge" hidden>0</span>
            <span id="cart-button-label" class="visually-hidden">سلة التسوق فارغة</span>
          </button>
          <button id="mobile-menu-btn" class="header-button mobile-only" type="button" aria-label="القائمة">
            <svg class="header-button__icon" aria-hidden="true"><use href="#icon-menu" /></svg>
          </button>
        </div>
      </div>
    </header>

    <!-- Mobile Drawer -->
    <div id="mobile-drawer" class="mobile-drawer" hidden>
      <div class="mobile-drawer__overlay" id="mobile-drawer-overlay"></div>
      <div class="mobile-drawer__content">
        <div class="mobile-drawer__header">
          <h2>القائمة</h2>
          <button id="mobile-menu-close" class="header-button" type="button">
            <svg class="header-button__icon" aria-hidden="true"><use href="#icon-close-menu" /></svg>
          </button>
        </div>
        <div class="mobile-drawer__body" id="mobile-drawer-body">
        </div>
      </div>
    </div>

    <section class="hero-banner" aria-label="العروض المميزة">
      <div class="carousel" id="main-carousel">
        <div class="carousel__track" id="carousel-track">
          <!-- Banners will be injected here dynamically -->
        </div>

        <button class="carousel__button carousel__button--prev" aria-label="السابق">
          <svg viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="15 18 9 12 15 6"></polyline>
          </svg>
        </button>
        <button class="carousel__button carousel__button--next" aria-label="التالي">
          <svg viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="9 18 15 12 9 6"></polyline>
          </svg>
        </button>

        <div class="carousel__dots" id="carousel-dots"></div>
      </div>
    </section>

    <div class="layout">
      <!-- Sidebar first in source order: LTR places it on the left. -->
      <aside class="categories" aria-label="تصنيفات الماركات">
        <h2 class="categories__heading">الماركات</h2>
        <ul id="category-list" class="categories__list"></ul>
      </aside>

      <main class="content">
        <div class="content__bar">
          <h2 id="results-title" class="content__title">كل الماركات</h2>
          <!-- Announces the new total to screen readers as filters change. -->
          <p id="results-count" class="content__count" aria-live="polite"></p>
        </div>

        <ul id="product-grid" class="product-grid"></ul>

        <p id="empty-state" class="empty-state" hidden>
          لا توجد منتجات مطابقة لبحثك.
        </p>
      </main>
    </div>

    <footer class="site-footer">
      <p>© <span id="current-year"></span> AKAD GROUP — Luxury Beauty Collection</p>
    </footer>

    <!-- Native <dialog> provides the focus trap, Escape handling, and backdrop
         without a custom modal implementation. Bodies and footers are rendered
         by their view modules, since each one is multi-step. -->
    <dialog id="checkout-dialog" class="modal" aria-labelledby="checkout-title">
      <div class="modal__panel">
        <header class="modal__head">
          <h2 id="checkout-title" class="modal__title">سلة التسوق</h2>
          <button id="checkout-close" class="modal__close" type="button" aria-label="إغلاق">
            <svg aria-hidden="true"><use href="#icon-close" /></svg>
          </button>
        </header>
        <div id="checkout-body" class="modal__body"></div>
        <footer id="checkout-actions" class="modal__actions"></footer>
      </div>
    </dialog>

    <dialog id="auth-dialog" class="modal modal--narrow" aria-labelledby="auth-title">
      <div class="modal__panel">
        <header class="modal__head">
          <h2 id="auth-title" class="modal__title">حسابي</h2>
          <button id="auth-close" class="modal__close" type="button" aria-label="إغلاق">
            <svg aria-hidden="true"><use href="#icon-close" /></svg>
          </button>
        </header>
        <div id="auth-body" class="modal__body"></div>
      </div>
    </dialog>

    <dialog id="admin-dialog" class="modal modal--wide" aria-labelledby="admin-title">
      <div class="modal__panel">
        <header class="modal__head">
          <h2 id="admin-title" class="modal__title">لوحة التحكم</h2>
          <button id="admin-close" class="modal__close" type="button" aria-label="إغلاق">
            <svg aria-hidden="true"><use href="#icon-close" /></svg>
          </button>
        </header>
        <div class="modal__body dashboard">
          <nav id="admin-tabs" class="dashboard__nav" aria-label="أقسام لوحة التحكم"></nav>
          <div id="admin-panel" class="dashboard__panel"></div>
        </div>
      </div>
    </dialog>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/catalog.js"></script>
    <script src="js/supabase.js?v=2"></script>
    <script src="js/emitter.js"></script>
    <script src="js/storage.js"></script>
    <script src="js/format.js"></script>
    <script src="js/dom.js?v=2"></script>
    <script src="js/toast.js"></script>
    <script src="js/inventory.js?v=2"></script>
    <script src="js/banners.js"></script>
    <script src="js/auth.js?v=2"></script>
    <script src="js/orders.js"></script>
    <script src="js/cart.js"></script>
    <script src="js/checkout.js"></script>
    <script src="js/auth-ui.js?v=3"></script>
    <script src="js/brands.js"></script>
    <script src="js/admin.js?v=3"></script>
    <script src="js/carousel.js"></script>
    <script src="js/app.js"></script>
  </body>
</html>
